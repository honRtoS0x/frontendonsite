<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Trang Web Shopee Cơ Bản</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <h1>Shopee</h1>
        <div class="search-box">
            <input type="text" placeholder="Tìm kiếm sản phẩm...">
            <button>Tìm</button>
        </div>
    </div>
    <div class="hero">
        <h2>Siêu Sale Giảm Giá 50%</h2>
    </div>
    <div class="container">
        <h2>Gợi Ý Hôm Nay</h2>
        <div class="product-list">
            <div class="card">
                <span class="badge">Sale 30%</span>
                <button class="wishlist-btn">❤️</button>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTS7FcpB-oVu0nK_38LPYyvaYwbOfgH2Rf2mmq1rhSxEA&s=10" alt="Sản phẩm">
                <div class="card-body">
                    <h3>Tai Nghe Bluetooth</h3>
                    <p class="price">840.000đ</p>
                    <button class="buy-btn">Mua Ngay</button>
                </div>
            </div>
            <div class="card">
                <span class="badge">Sale 45%</span>
                <button class="wishlist-btn">❤️</button>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6B7m_49KzPuzVEZ5NTVPKz3V1CmeOvAPFesxE6hbldw&s=10" alt="Sản phẩm">
                <div class="card-body">
                    <h3>Đồng Hồ Thông Minh</h3>
                    <p class="price">1.100.000đ</p>
                    <button class="buy-btn">Mua Ngay</button>
                </div>
            </div>
            <div class="card">
                <span class="badge">Sale 20%</span>
                <button class="wishlist-btn">❤️</button>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTiok6OZFX7mV6HgCt-9D1-8nX2x9h14UGo3W_puItNoA&s=10" alt="Sản phẩm">
                <div class="card-body">
                    <h3>Giày Thể Thao</h3>
                    <p class="price">1.200.000đ</p>
                    <button class="buy-btn">Mua Ngay</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
